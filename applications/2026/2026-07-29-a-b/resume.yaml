  experience:
    - position: Graduate Research Assistant
      organization: Biorobotics and Biomechanics Lab, University of Maine
      location: Orono, ME
      date: Sep 2023 - Present
      highlights:
        - Development of real-time wearable sensing systems and Android-based mobile applications for gait 
          analysis, activity recognition, fall-risk assessment, and home-based rehabilitation.
        - Built a smartphone-deployed gait assessment system using a single foot-mounted IMU to reconstruct 
          foot-height trajectories and classify terrains across level walking, stairs, and ramps, achieving 
          **96% accuracy**, **<1.1 cm error**, and **112 ms latency**.
        - Engineered a lightweight human activity recognition system using two IMUs, biomechanical feature 
          extraction, and classifiers including SVM and NB, achieving **99% accuracy** for normal locomotion 
          and **93% accuracy** for atypical stair-negotiation strategies in older adults.
        - Architected a home-based haptic feedback gait-training system integrating IMUs, vibrotactile motors,
          custom Android applications, Arduino/SparkFun modules, and PCB circuitry for adults aged 65+.
        - Demonstrated up to **30% improvement** in stride length and walking speed during a single-session 
          haptic feedback study, with minimal cognitive demand.
        - Led IRB-approved human-subject validation studies with **85+ participants** across gait analysis, 
          activity recognition, and haptic feedback protocols.
        - Developed real-time algorithms and data pipelines in Android Studio/Java, Python, and MATLAB, 
          combining signal processing, sensor fusion, biomechanical modeling, and machine learning for mobile 
          health applications.
